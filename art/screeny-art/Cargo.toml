[package]
name = "screeny-art"
version = "0.1.0"
edition = "2021"
description = "Generative art pieces and the output pipeline for the screeny 64x32 LED panel"

[dependencies]
serde = { version = "1", features = ["derive"] }
png = "0.17"
wgpu = { version = "30.0.1", optional = true }
pollster = { version = "1.0.1", optional = true }
bytemuck = { version = "1.25.2", features = ["derive"], optional = true }

[features]
default = ["gpu"]
# GPU pieces, through wgpu. Build with --no-default-features for a CPU-only runner.
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]
