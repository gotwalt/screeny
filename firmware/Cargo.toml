[package]
name = "screeny-fw"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "MIT OR Apache-2.0"
description = "screeny firmware: Tidbyt Gen 1 (ESP32) as a UDP network frame buffer"

# Standalone crate: deliberately not part of any parent workspace.
[workspace]

# `esp-hub75`'s public framebuffer types *are* `hub75-framebuffer`'s types, so
# the patched copy has to replace the registry one everywhere rather than sit
# beside it. What changed and why: `vendor/README.md`.
[patch.crates-io]
hub75-framebuffer = { path = "vendor/hub75-framebuffer" }

[features]
default = []
# Bench A/B only (card 008): run the display task on core 0's executor, the
# way card 007 shipped it, so the cost of the core split can be measured
# against the identical decode path. Never ship this.
display-on-core0 = []
# Card 200 research spike, minus the settings half that card 212 replaced with
# the real thing in `src/store.rs`. What is left is the OTA evidence: the
# partition table, otadata, pre-activation validation and the staging loop.
# Off by default; never flashed. See docs/research/006-flash-store-ota.md.
spike-ota = []

# **Bench override for the WiFi credentials** (owner's decision, 2026-09-20).
# OFF by default, and off means off: with the feature clear `build.rs` does not
# read the environment, `firmware/wifi.env` or `~/.config/screeny/wifi.env` at
# all, and `crate::SSID` / `crate::PASSWORD` do not exist, so anything that
# tried to use a compiled-in credential would fail to compile rather than
# silently ship one. A default build joins from the store and nothing else.
#
# With the feature on, the pair is embedded and does exactly two things: it
# seeds an *empty* store at boot through the ordinary save path, and it is spec
# section 8.3 step 2 - the fallback after stored credentials have failed three
# times. The bench flow is to flash a `bench-wifi` build once to seed the store,
# then flash the default build and watch it join from flash alone.
bench-wifi = []

# Card 212's bench self-test. A worker cannot reach the device over the LAN, so
# this exercises the store on the device by itself at boot + 20 s: it saves a
# name, a brightness and an idle mode through the same code path the control
# handlers use, times each write and counts its sector erases, prints the
# `render` maximum over each write, then reboots **once** (guarded by a marker
# value, so it cannot loop) and reports what it loaded. Off by default.
store-selftest = []
# Card 220's measurement build. Brings up `Config::AccessPointStation` with an
# open soft-AP and a second embassy-net stack that nothing listens on, so the
# serial log can answer "what does APSTA cost in heap" with a number. Off by
# default and never shipped: the default build must be byte-for-byte unaffected
# by its existence. `internal-heap-stats` rides along because a 5 s sample
# cannot see the radio's transient allocations and esp-alloc's own `max_usage`
# can; it costs CPU on every alloc, which is why it is only here.
# See docs/research/009-ram-headroom.md.
apsta-probe = ["esp-alloc/internal-heap-stats"]
# Card 220's A/B, and the only reason the old framebuffer construction still
# exists: it puts the two 12 KB `FrameBuffer::new()` temporaries back on core
# 0's main stack so the "before" half of the stack high-water measurement can
# be reproduced without checking out an older commit. Like `display-on-core0`,
# it is a thing to measure against, not a configuration to run the panel in.
fb-on-stack = []

# **Card 243's bench build.** Panic on core 0 twenty seconds after boot,
# **once** per power-on, so the orchestrator can watch the whole path: the
# backtrace, the breadcrumb, the reset, the rejoin, and the next boot reporting
# the panic in its log and in `GET /api/v1/status`. The one-shot latch lives in
# the breadcrumb itself, so the reset it causes does not arm it again and a
# flashed bench build cannot become the crash loop this card is about. Off by
# default; never shipped.
panic-test = []

# Card 202's bench tool. It gates `[[bin]] gpio_probe` through
# `required-features`, so a plain `cargo build --release` never builds it and
# the shipping firmware is unaffected. See `docs/research/008-button.md`.
gpio-probe = []

# Card 201's compile-only spike (`device-web-spike`, `spike-ap`,
# `spike-portal`, `spike-qr`) was **retired by card 223**, together with
# `src/web_spike.rs` and `src/web_spike/`. It existed to prove that
# `esp-radio`'s APSTA mode, a second `embassy-net` stack, `edge-dhcp`,
# `edge-captive` and the QR encoder link on this chip at these versions. They
# are all in the default build now and the device runs them, which is better
# evidence than a build that was never flashed - and a second spelling of each
# was two places to get them wrong. The HTTP third went the same way in card
# 222, for the same reason.

# **Card 223's bench build.** Boot as if the settings store held no
# credentials, **without erasing or overwriting a byte of it**: the machine is
# told `has_stored: false`, so it goes straight to `Portal`, raises the soft-AP
# and puts the QR on the panel. The owner's real credentials are still in
# flash, so typing them into the setup form runs a real trial that really
# joins and really commits. This is the build the phone test is done with; it
# does not join a network by itself, so there is no stream while it runs. Off
# by default, and a plain `cargo build --release` must never pick it up.
start-in-portal = []

# Card 222's bench self-test. A worker cannot reach the device over the LAN, so
# this asks the device to make the request itself: 30 s after boot it opens a
# TCP connection **to its own address** on port 80 through embassy-net and
# issues `GET /api/v1/status` a few dozen times while the Studio streams,
# logging status codes, bytes, per-request time, and the fps / decode-drop /
# `render` numbers over the window. If the stack cannot reach its own address
# (a WiFi station has no loopback and an access point need not hairpin), it
# says so and falls back to reporting that the accept loop is ready plus the
# same telemetry window. Off by default.
http-selftest = []

# Both binaries are declared explicitly so that neither can be picked up (or
# dropped) by accident: `screeny-fw` is the firmware, `gpio_probe` is the
# card 202 bench tool and only exists when its feature is on.
[[bin]]
name = "screeny-fw"
path = "src/main.rs"

[[bin]]
name = "gpio_probe"
path = "src/bin/gpio_probe.rs"
required-features = ["gpio-probe"]

[dependencies]
# --- HAL / runtime -------------------------------------------------------
esp-hal = { version = "=1.2.2", features = ["esp32", "unstable", "log-04"] }
esp-rtos = { version = "=0.4.0", features = ["esp32", "embassy", "esp-radio", "log-04"] }
esp-alloc = { version = "=0.11.0", features = ["esp32"] }
# `embedded-storage` is what gives `FlashRegion::as_nor_flash()`, which is how
# the settings store reaches the `screeny` partition (card 212). It used to ride
# on the `spike-ota` feature; it is unconditional now that the store ships.
esp-bootloader-esp-idf = { version = "=0.6.0", features = ["esp32", "embedded-storage"] }
# **Without `panic-handler` since card 243**: `src/panic.rs` is this firmware's
# `#[panic_handler]`, because the breadcrumb it writes needs the `&PanicInfo`
# (esp-backtrace's `custom-halt` hook takes no arguments, so the `file:line` is
# gone by the time it runs). What is used from here is `Backtrace::capture`,
# which is public and not behind that feature, so the frames on the serial log
# are still esp-backtrace's and `espflash monitor` symbolises them as before.
esp-backtrace = { version = "=0.20.0", features = ["esp32", "println"] }
esp-println = { version = "=0.18.0", features = ["esp32", "log-04", "auto"] }
# The cycle counter and `interrupt::free`, for the panic path only. Already in
# the tree as esp-hal's own dependency, at this version; named here because
# `src/panic.rs` calls it directly. `CCOUNT` runs from reset and needs no
# peripheral to have been set up, which is why the pre-reset settle is counted
# in cycles and not in `Instant`s.
xtensa-lx = { version = "=0.13.0" }

# --- WiFi ----------------------------------------------------------------
# NOTE: 1.0.0-beta.1 (not beta.2) — beta.2 wants esp-metadata-generated ^0.6,
# esp-hub75 0.17 wants ^0.5. See docs/research/001-firmware-stack.md.
esp-radio = { version = "=1.0.0-beta.1", features = ["esp32", "wifi", "unstable", "log-04"] }

# --- Async / net ---------------------------------------------------------
embassy-executor = { version = "0.10.0" }
embassy-time = { version = "0.5.1" }
embassy-net = { version = "0.9.1", features = ["dhcpv4", "medium-ethernet", "udp", "tcp", "proto-ipv4", "multicast"] }
embassy-sync = { version = "0.8.0" }
embassy-futures = { version = "0.1.2" }

# --- Display -------------------------------------------------------------
esp-hub75 = { version = "=0.17.0", default-features = false, features = [
  "esp32",
  "log",
  "iram",              # refresh ISR in IRAM: mandatory when WiFi is active
  # NOTE: no "skip-black-pixels". It only short-circuits `set_pixel`, and the
  # display path writes whole rows through `write_row` instead, which always
  # writes and therefore needs no `erase()` pass. Leaving the feature on would
  # only suggest a fast path we do not take.
  "circular-dma",      # DMA loops forever; swaps are pointer-delta updates
  "tail-closes-latch",
  "trail-blank-8",
  "invert-blank",
  "invert-oe",
] }
embedded-graphics = { version = "0.8.2" }

# --- discovery ------------------------------------------------------------
edge-mdns = { version = "=0.8.0", default-features = false, features = ["io"] }
edge-nal-embassy = "=0.9.0"
rand_core = { version = "0.10", default-features = false }

# --- the wire protocol ----------------------------------------------------
# Card 005's crate, by path, exactly as architecture.md says. Every byte that
# reaches or leaves a socket goes through it; the firmware parses nothing.
screeny-proto = { path = "../crates/proto" }

# Card 016's shared receive state machine: sections 3.3, 4.7, 6 and 7, the same
# no_std crate crates/sim runs on, so the device and the simulator cannot drift
# apart in behaviour the way they could while each kept its own copy.
screeny-receiver = { path = "../crates/receiver" }

# --- the settings store (card 212) ----------------------------------------
# Card 211's crate: the key set, the value encoding, the schema version, the
# load/save policy and the debounce timer, all `no_std` and host-tested. The
# device half - the partition, the multi-core discipline, the task - is
# `src/store.rs`.
screeny-settings = { path = "../crates/settings" }

# esp-storage is already in the tree as an esp-bootloader-esp-idf dependency,
# but pulled with default-features = false there, so `critical-section` (which
# runs each ROM flash call with this core's interrupts masked) is off unless we
# ask for it here. It must be on: the ESP32 cache cannot serve reads while SPI1
# is erasing, so an interrupt handler whose code lives in flash, firing
# mid-erase, is a crash (research 006 section 4).
esp-storage = { version = "=0.10.0", default-features = false, features = [
  "esp32",
  "critical-section",
  "embedded-storage",
] }
# `sequential-storage` is async-only, hence embassy-embedded-hal's BlockingAsync
# around the blocking NorFlash that esp-bootloader-esp-idf hands us. It arrives
# through `screeny-settings`; the direct dependency here is for the version pin
# to be visible in one place.
sequential-storage = { version = "=8.0.1" }
embedded-storage = { version = "=0.3.1" }
embassy-embedded-hal = { version = "=0.6.0" }

# --- the HTTP server (card 222) -------------------------------------------
# `picoserve 0.20` is pinned because it is pinned *to our pins*: its own
# manifest wants embassy-net =0.9.1, embassy-time ^0.5.1, heapless 0.9.3,
# serde 1 and serde-json-core 0.6, which are the versions above. Card 201
# proved it links on Xtensa at exactly this version; card 222 ships it.
picoserve = { version = "=0.20.0", default-features = false, features = [
  "embassy",
  "json",
  "log",
] }
# picoserve's `Read`/`Write` traits are `embedded-io-async`'s, and the request
# body reader is named in `src/http.rs`, so the version has to be visible here.
embedded-io-async = { version = "0.7.0" }
serde = { version = "1", default-features = false, features = ["derive"] }
# The JSON *parser*. picoserve's `Json` extractor would do, but its rejection
# is plain text with picoserve's own status code, and every other failure on
# this API is `{"error":...}` with `screeny-device-api`'s. `src/http.rs` calls
# `from_slice_escaped` itself so that one shape covers all of them. Same
# version picoserve depends on, so there is one copy in the binary.
serde-json-core = { version = "=0.6.0", default-features = false }

# The request and reply shapes, shared with the simulator and the Studio.
screeny-device-api = { path = "../crates/device-api" }

# --- the setup portal (card 223) ------------------------------------------
# The soft-AP's DHCP server and DNS catch-all. Card 201 proved they link at
# exactly these versions; card 223 ships them. edge-captive / edge-dhcp 0.8
# want edge-nal 0.7 and domain 0.12, which edge-mdns 0.8 + edge-nal-embassy 0.9
# already carry, so there is one copy of each in the binary.
edge-nal = { version = "=0.7.0", default-features = false }
edge-captive = { version = "=0.8.0", default-features = false, features = ["io"] }
edge-dhcp = { version = "=0.8.0", default-features = false, features = ["io"] }

# Card 221's crate: the join/portal state machine, the `WIFI:` QR payload and
# the portal screen. `no_std`, host-tested (60 tests, and the rendered QR is
# decoded back by an independent decoder), and driven by the simulator too, so
# the device and the sim cannot answer differently. The firmware implements
# none of its rules; `src/provision.rs` supplies the radio, the clock and the
# flash it deliberately does not have. It brings `qrcodegen-no-heap` with it,
# so the QR encoder is no longer a direct dependency here.
screeny-provision = { path = "../crates/provision" }

# --- misc ----------------------------------------------------------------
heapless = { version = "0.9.3" }
static_cell = { version = "2.1.1" }
log = { version = "0.4.30" }

[profile.dev]
debug = true
opt-level = "s"

# "The radio blobs require optimization level 2 or 3 to function correctly."
# — esp-radio's own documentation. The release profile is fine; a debug build
# without this silently misbehaves.
[profile.dev.package.esp-radio]
opt-level = 3

[profile.release]
debug = true      # symbols do not cost flash space
opt-level = "s"
lto = "fat"
codegen-units = 1
