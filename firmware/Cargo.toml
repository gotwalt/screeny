[package]
name = "screeny-fw"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "MIT OR Apache-2.0"
description = "screeny firmware: Tidbyt Gen 1 (ESP32) as a UDP network frame buffer"

# Standalone crate: deliberately not part of any parent workspace.
[workspace]

# `esp-hub75`'s public framebuffer types *are* `hub75-framebuffer`'s types, so
# the patched copy has to replace the registry one everywhere rather than sit
# beside it. What changed and why: `vendor/README.md`.
[patch.crates-io]
hub75-framebuffer = { path = "vendor/hub75-framebuffer" }

[features]
default = []
# Bench A/B only (card 008): run the display task on core 0's executor, the
# way card 007 shipped it, so the cost of the core split can be measured
# against the identical decode path. Never ship this.
display-on-core0 = []
# Card 200 research spike. Compile-only evidence that the OTA + settings-store
# APIs link on this pinned stack, and what they cost in flash and RAM. Off by
# default; never flashed. See docs/research/006-flash-store-ota.md.
spike-ota = [
  "dep:esp-storage",
  "dep:sequential-storage",
  "dep:embedded-storage",
  "dep:embassy-embedded-hal",
  "esp-bootloader-esp-idf/embedded-storage",
]
# Card 220's measurement build. Brings up `Config::AccessPointStation` with an
# open soft-AP and a second embassy-net stack that nothing listens on, so the
# serial log can answer "what does APSTA cost in heap" with a number. Off by
# default and never shipped: the default build must be byte-for-byte unaffected
# by its existence. `internal-heap-stats` rides along because a 5 s sample
# cannot see the radio's transient allocations and esp-alloc's own `max_usage`
# can; it costs CPU on every alloc, which is why it is only here.
# See docs/research/009-ram-headroom.md.
apsta-probe = ["esp-alloc/internal-heap-stats"]
# Card 220's A/B, and the only reason the old framebuffer construction still
# exists: it puts the two 12 KB `FrameBuffer::new()` temporaries back on core
# 0's main stack so the "before" half of the stack high-water measurement can
# be reproduced without checking out an older commit. Like `display-on-core0`,
# it is a thing to measure against, not a configuration to run the panel in.
fb-on-stack = []

# Card 202's bench tool. It gates `[[bin]] gpio_probe` through
# `required-features`, so a plain `cargo build --release` never builds it and
# the shipping firmware is unaffected. See `docs/research/008-button.md`.
gpio-probe = []

# Card 201's compile-only spike. **Evidence, not the implementation.** It
# exists so the research doc can quote a real image size and a real `.bss`
# growth for "an HTTP server + a soft-AP + a captive portal on this stack",
# and so that every API claim in the doc is one the compiler agreed with.
# It is never flashed and the build cards replace it wholesale.
device-web-spike = ["spike-ap", "spike-http", "spike-portal", "spike-qr"]
# Split so the research doc can attribute the flash and `.bss` growth to the
# piece that caused it: each of these builds on its own.
spike-ap = []
spike-http = ["spike-ap", "dep:picoserve", "dep:embedded-io-async", "dep:serde"]
spike-portal = ["spike-ap", "dep:edge-captive", "dep:edge-dhcp", "dep:edge-nal"]
spike-qr = ["dep:qrcodegen-no-heap"]

# Both binaries are declared explicitly so that neither can be picked up (or
# dropped) by accident: `screeny-fw` is the firmware, `gpio_probe` is the
# card 202 bench tool and only exists when its feature is on.
[[bin]]
name = "screeny-fw"
path = "src/main.rs"

[[bin]]
name = "gpio_probe"
path = "src/bin/gpio_probe.rs"
required-features = ["gpio-probe"]

[dependencies]
# --- HAL / runtime -------------------------------------------------------
esp-hal = { version = "=1.2.2", features = ["esp32", "unstable", "log-04"] }
esp-rtos = { version = "=0.4.0", features = ["esp32", "embassy", "esp-radio", "log-04"] }
esp-alloc = { version = "=0.11.0", features = ["esp32"] }
esp-bootloader-esp-idf = { version = "=0.6.0", features = ["esp32"] }
esp-backtrace = { version = "=0.20.0", features = ["esp32", "panic-handler", "println"] }
esp-println = { version = "=0.18.0", features = ["esp32", "log-04", "auto"] }

# --- WiFi ----------------------------------------------------------------
# NOTE: 1.0.0-beta.1 (not beta.2) — beta.2 wants esp-metadata-generated ^0.6,
# esp-hub75 0.17 wants ^0.5. See docs/research/001-firmware-stack.md.
esp-radio = { version = "=1.0.0-beta.1", features = ["esp32", "wifi", "unstable", "log-04"] }

# --- Async / net ---------------------------------------------------------
embassy-executor = { version = "0.10.0" }
embassy-time = { version = "0.5.1" }
embassy-net = { version = "0.9.1", features = ["dhcpv4", "medium-ethernet", "udp", "proto-ipv4", "multicast"] }
embassy-sync = { version = "0.8.0" }
embassy-futures = { version = "0.1.2" }

# --- Display -------------------------------------------------------------
esp-hub75 = { version = "=0.17.0", default-features = false, features = [
  "esp32",
  "log",
  "iram",              # refresh ISR in IRAM: mandatory when WiFi is active
  # NOTE: no "skip-black-pixels". It only short-circuits `set_pixel`, and the
  # display path writes whole rows through `write_row` instead, which always
  # writes and therefore needs no `erase()` pass. Leaving the feature on would
  # only suggest a fast path we do not take.
  "circular-dma",      # DMA loops forever; swaps are pointer-delta updates
  "tail-closes-latch",
  "trail-blank-8",
  "invert-blank",
  "invert-oe",
] }
embedded-graphics = { version = "0.8.2" }

# --- discovery ------------------------------------------------------------
edge-mdns = { version = "=0.8.0", default-features = false, features = ["io"] }
edge-nal-embassy = "=0.9.0"
rand_core = { version = "0.10", default-features = false }

# --- the wire protocol ----------------------------------------------------
# Card 005's crate, by path, exactly as architecture.md says. Every byte that
# reaches or leaves a socket goes through it; the firmware parses nothing.
screeny-proto = { path = "../crates/proto" }

# Card 016's shared receive state machine: sections 3.3, 4.7, 6 and 7, the same
# no_std crate crates/sim runs on, so the device and the simulator cannot drift
# apart in behaviour the way they could while each kept its own copy.
screeny-receiver = { path = "../crates/receiver" }

# --- card 200 spike: flash store + OTA (feature `spike-ota` only) ---------
# esp-storage is already in the tree as an esp-bootloader-esp-idf dependency,
# but pulled with default-features = false there, so `critical-section` (which
# runs each ROM flash call with this core's interrupts masked) is off unless we
# ask for it here.
esp-storage = { version = "=0.10.0", optional = true, default-features = false, features = [
  "esp32",
  "critical-section",
  "embedded-storage",
] }
# Async-only, hence embassy-embedded-hal's BlockingAsync around the blocking
# NorFlash that esp-bootloader-esp-idf hands us.
sequential-storage = { version = "=8.0.1", optional = true }
embedded-storage = { version = "=0.3.1", optional = true }
embassy-embedded-hal = { version = "=0.6.0", optional = true }

# --- card 201's spike (feature `device-web-spike` only) -------------------
# All optional, all pinned, all chosen because they already agree with the
# versions above: picoserve 0.20 wants embassy-net =0.9.1 / embassy-time
# ^0.5.1 / heapless 0.9.3, and edge-captive / edge-dhcp 0.8 want edge-nal 0.7
# and domain 0.12, which edge-mdns 0.8 + edge-nal-embassy 0.9 already carry.
picoserve = { version = "=0.20.0", optional = true, default-features = false, features = [
  "embassy",
  "json",
  "log",
] }
edge-nal = { version = "=0.7.0", optional = true, default-features = false }
edge-captive = { version = "=0.8.0", optional = true, default-features = false, features = ["io"] }
edge-dhcp = { version = "=0.8.0", optional = true, default-features = false, features = ["io"] }
qrcodegen-no-heap = { version = "=1.8.1", optional = true }
embedded-io-async = { version = "0.7.0", optional = true }
serde = { version = "1", optional = true, default-features = false, features = ["derive"] }

# --- misc ----------------------------------------------------------------
heapless = { version = "0.9.3" }
static_cell = { version = "2.1.1" }
log = { version = "0.4.30" }

[profile.dev]
debug = true
opt-level = "s"

# "The radio blobs require optimization level 2 or 3 to function correctly."
# — esp-radio's own documentation. The release profile is fine; a debug build
# without this silently misbehaves.
[profile.dev.package.esp-radio]
opt-level = 3

[profile.release]
debug = true      # symbols do not cost flash space
opt-level = "s"
lto = "fat"
codegen-units = 1
