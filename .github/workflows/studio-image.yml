name: Studio image (ghcr)

# Builds the Studio image (root Dockerfile) natively on an amd64 and an arm64
# runner (no QEMU: Rust + wgpu under emulation takes far too long), then stitches
# the per-arch images into multi-arch manifests on ghcr.io. Two images, one build:
# the Dockerfile's two final stages differ only in the USER line, so the second
# build per arch is a cache hit.
#
#   ghcr.io/gotwalt/screeny-studio   `runtime` target: the standalone service
#                                    (unprivileged), what docker-compose.yml runs.
#   ghcr.io/gotwalt/screeny-ha-app   `app` target: the Home Assistant app image
#                                    (runs as root), what ha-app/config.yaml names,
#                                    so the Supervisor needs no {arch} substitution.
#
# Tags published:
#   screeny-ha-app    <version> from ha-app/config.yaml (exactly what the Supervisor
#                     asks for), edge, sha-<short> on main pushes, and latest on
#                     app-v* release tags only.
#   screeny-studio    edge, sha-<short> and latest on main pushes. There is no
#                     standalone release process, so `latest` follows main (same as
#                     `edge`) rather than pointing at nothing: a bare `docker pull`
#                     must work. Nothing is published for app-v* tags.
#
# Once, after the first run: ghcr packages are private by default. Make BOTH public
# (github.com/gotwalt?tab=packages > each package > Package settings > Change
# visibility), or nobody can pull them anonymously.
#
# Why plain docker/build-push-action and not home-assistant/builder: the Dockerfile
# is the Studio's own, shared with docker-compose, and builds one image with a
# stage target; the HA builder wants the app folder's Dockerfile and BUILD_FROM
# plumbing, and adds nothing for a pre-built `image:` app.
on:
  push:
    branches: [main]
    tags: ["app-v*"]
    paths:
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - Dockerfile
      - .dockerignore
      - ha-app/**
      - .github/workflows/studio-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: studio-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: studio
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/${{ matrix.arch }}
          provenance: false
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          outputs: type=image,name=ghcr.io/gotwalt/screeny-studio,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=studio-${{ matrix.arch }}
          cache-to: type=gha,scope=studio-${{ matrix.arch }},mode=max
      - id: app
        uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          platforms: linux/${{ matrix.arch }}
          provenance: false
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          outputs: type=image,name=ghcr.io/gotwalt/screeny-ha-app,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=studio-${{ matrix.arch }}
          cache-to: type=gha,scope=studio-${{ matrix.arch }},mode=max
      - name: Export digests
        env:
          STUDIO: ${{ steps.studio.outputs.digest }}
          APP: ${{ steps.app.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests/studio" "${RUNNER_TEMP}/digests/app"
          touch "${RUNNER_TEMP}/digests/studio/${STUDIO#sha256:}"
          touch "${RUNNER_TEMP}/digests/app/${APP#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-studio-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/studio/*
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: digest-app-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/app/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: studio
            image: ghcr.io/gotwalt/screeny-studio
          - target: app
            image: ghcr.io/gotwalt/screeny-ha-app
    env:
      IMAGE: ${{ matrix.image }}
      # The standalone image has no release tags: nothing to publish for app-v*.
      PUBLISH: ${{ matrix.target == 'app' || github.ref_type == 'branch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Read the app version
        id: version
        run: |
          v="$(sed -n 's/^version: *"\{0,1\}\([^"]*\)"\{0,1\} *$/\1/p' ha-app/config.yaml | head -n1)"
          test -n "$v" || { echo "no version in ha-app/config.yaml" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: A release tag must match the app version
        if: startsWith(github.ref, 'refs/tags/app-v')
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          test "$TAG" = "app-v$VERSION" || { echo "tag $TAG does not match config.yaml version $VERSION" >&2; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-${{ matrix.target }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ matrix.target == 'app' }}
            type=edge,branch=main
            type=sha,prefix=sha-,format=short,enable=${{ github.ref_type == 'branch' }}
            type=raw,value=latest,enable=${{ (matrix.target == 'app' && startsWith(github.ref, 'refs/tags/app-v')) || (matrix.target == 'studio' && github.ref == 'refs/heads/main') }}
      - name: Create the manifest list
        if: env.PUBLISH == 'true'
        working-directory: ${{ runner.temp }}/digests
        run: |
          tags="$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
          refs=""
          for d in *; do refs="$refs ${IMAGE}@sha256:${d}"; done
          # word splitting is intended: several -t flags, several digests
          # shellcheck disable=SC2086
          docker buildx imagetools create $tags $refs
      - name: Inspect the result
        if: env.PUBLISH == 'true'
        run: docker buildx imagetools inspect "$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
