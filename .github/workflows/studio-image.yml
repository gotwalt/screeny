name: Studio image (ghcr)

# Builds the Studio image (root Dockerfile, `--target app`) natively on an amd64
# and an arm64 runner (no QEMU: Rust + wgpu under emulation takes far too long),
# then stitches the two into one multi-arch manifest on ghcr.io. That one
# reference is what ha-app/config.yaml's `image:` names, so the Supervisor needs
# no {arch} substitution.
#
# Tags published:
#   <version>   from ha-app/config.yaml: exactly what the Supervisor asks for
#   edge, sha-<short>   moving tag and immutable tag for a main push
#   latest      on app-v* release tags only
#
# Once, after the first run: the package is private by default. Make it public
# (github.com/gotwalt?tab=packages > screeny-studio > Package settings > Change
# visibility), or Home Assistant cannot pull it anonymously.
#
# Why plain docker/build-push-action and not home-assistant/builder: the Dockerfile
# is the Studio's own, shared with docker-compose, and builds one image with a
# stage target; the HA builder wants the app folder's Dockerfile and BUILD_FROM
# plumbing, and adds nothing for a pre-built `image:` app.
on:
  push:
    branches: [main]
    tags: ["app-v*"]
    paths:
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - Dockerfile
      - .dockerignore
      - ha-app/**
      - .github/workflows/studio-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: studio-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/gotwalt/screeny-studio

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          platforms: linux/${{ matrix.arch }}
          provenance: false
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=studio-${{ matrix.arch }}
          cache-to: type=gha,scope=studio-${{ matrix.arch }},mode=max
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Read the app version
        id: version
        run: |
          v="$(sed -n 's/^version: *"\{0,1\}\([^"]*\)"\{0,1\} *$/\1/p' ha-app/config.yaml | head -n1)"
          test -n "$v" || { echo "no version in ha-app/config.yaml" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: A release tag must match the app version
        if: startsWith(github.ref, 'refs/tags/app-v')
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          test "$TAG" = "app-v$VERSION" || { echo "tag $TAG does not match config.yaml version $VERSION" >&2; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=edge,branch=main
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/app-v') }}
      - name: Create the manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          tags="$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
          refs=""
          for d in *; do refs="$refs ${IMAGE}@sha256:${d}"; done
          # word splitting is intended: several -t flags, several digests
          # shellcheck disable=SC2086
          docker buildx imagetools create $tags $refs
      - name: Inspect the result
        run: docker buildx imagetools inspect "${IMAGE}:${{ steps.version.outputs.version }}"
