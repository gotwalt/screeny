[workspace]
members = ["nostd-check"]
exclude = ["xtensa-bench"]

[package]
name = "lab"
version = "0.1.0"
edition = "2021"
description = "Frame-encoding lab for screeny: measure candidate codecs for a 64x32 LED panel in one UDP datagram"

[dependencies]
png = "0.17"
# Card 201's portal-screen mock-up (`src/bin/portal-mock.rs`): the same QR
# encoder and the same fonts the firmware would use, so the picture in
# docs/research/007 is the picture the panel would show.
qrcodegen-no-heap = "=1.8.1"
embedded-graphics = "0.8.2"

[profile.release]
opt-level = 3
debug = true
