# https://developers.home-assistant.io/docs/apps/configuration#app-configuration
# Design: docs/design/home-assistant-app.md (card 359).
name: Screeny
version: "0.1.1"
slug: screeny
description: Generative art on a Tidbyt LED panel, and the panel as a Home Assistant device.
url: https://github.com/gotwalt/screeny
arch:
  - aarch64
  - amd64

# The image is the Studio's own (the root Dockerfile, `--target app`), published
# multi-arch by card 360. The tag is the version above.
image: ghcr.io/gotwalt/screeny-ha-app

# Host networking: mDNS discovery and the UDP frame stream behave exactly as
# in docker-compose.yml.
host_network: true

# The Studio is reached through Home Assistant's ingress. For a host-network
# app the Supervisor connects to the hassio bridge's gateway (172.30.32.1) on
# ingress_port, and the Studio binds only that address in app mode.
# `ingress_port` (8099) and `panel_admin` (true: the panel is admin-only) are
# left at their defaults; the app linter refuses them spelled out.
ingress: true
panel_icon: mdi:led-strip-variant

# The MQTT broker (Mosquitto) is offered by the Supervisor when there is one.
services:
  - mqtt:want

# The binary handles SIGTERM itself (it sends FINAL so the panel lets go at
# once), so no init wrapper in between; and gives it the compose file's grace.
init: false
timeout: 25
# No `watchdog` (obsolete): the image's HEALTHCHECK polls /healthz instead.

options:
  direct_access: false
  direct_port: 8787
schema:
  direct_access: bool
  direct_port: port
