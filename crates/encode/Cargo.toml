[package]
name = "screeny-encode"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "screeny frame encoders and the per-frame codec chooser: give it a frame and a byte budget, get back a codec id and a payload guaranteed to fit and to decode"

# Split out of `crates/screeny` by card 016 so that `crates/demos` can measure
# what its art really costs on the wire without depending on the sender, which
# depends on it. Nothing else changed: the sender still reaches this through
# `screeny::encode`.
[dependencies]
screeny-proto = { path = "../proto" }
screeny-panel = { path = "../panel" }

[lints.rust]
missing_docs = "warn"
