[package]
name = "screeny-studio"
version = "0.1.0"
edition = "2021"
description = "Screeny Studio: an HTTP + WebSocket server for designing generative art for the panel"

[lib]
name = "screeny_studio"
path = "src/lib.rs"

[[bin]]
name = "screeny-studio"
path = "src/main.rs"

[features]
default = ["gpu"]
# The GPU pieces, through wgpu. `--no-default-features` builds a studio with
# no graphics driver in the tree at all - the CPU pieces only - which is what
# to reach for on a box with no usable adapter.
gpu = ["screeny-art/gpu"]

[dependencies]
# `sender` on: the studio can stream what it is showing to a real panel.
# Named explicitly even if `screeny-art` makes it a default (card 112), so
# that this crate says what it needs either way.
screeny-art = { path = "../art", default-features = false, features = ["sender"] }
# The device side: discovery, the control client, `Device`, `Link` (card 011's
# embedding API). `screeny-art` already pulls it in for `SenderOutput`; the
# registry and the device controls name it directly because they use it
# directly. No GUI and no graphics in that tree: see crates/screeny/README.md.
screeny = { path = "../screeny" }
# The server. No `tracing`, no `form`, no `tower-log`: this is a handful of
# routes and one socket, and every feature is a crate in the tree.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "net", "time", "sync", "fs", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# The reference receiver: "send to panel" is proved against it on loopback,
# never against the bench device. `window` off - the tests are headless.
screeny-sim = { path = "../sim", default-features = false }
# Only for the type in the simulator's frame sink; no dependencies, no sockets.
screeny-proto = { path = "../proto" }
# So a test can give itself a tiny receive buffer and stall on purpose.
socket2 = "0.6"
