<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Schedule · Screeny Studio</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="schedule-page">
  <!-- Card 301: one nav, the same markup on every screen, with the current
       one marked. -->
  <nav class="nav" aria-label="Screeny Studio">
    <a href="/">Picture</a>
    <a href="/panel">Panel</a>
    <a href="/schedule" aria-current="page">Schedule</a>
  </nav>

  <header class="titleblock">
    <div class="titleblock__patch">
      <h1>Schedule</h1>
    </div>
    <!-- The same trouble indicator every screen carries, so a fault is never
         hidden behind a tab - see common.js's `panelState` and `attention`. -->
    <dl class="readouts" aria-label="Panel">
      <div class="readouts__panel"><dt>Panel</dt><dd><a class="pill pill--link" id="ro-panel" href="/panel">–</a></dd></div>
    </dl>
  </header>

  <p class="notice sheet__notice" id="notice" role="status" hidden></p>

  <!-- Card 303: top to bottom, in the order the owner would ask about this
       screen - what is due now and until when, then the timetable that
       decides it, then the modes the timetable plays. -->
  <main class="sheet">
    <section id="sec-due">
      <h2>Now</h2>
      <p class="playing__title" id="due-line">–</p>
      <p class="playing__detail" id="due-note"></p>
      <div class="row" id="due-actions">
        <button type="button" id="resume" hidden>Back to schedule</button>
      </div>
    </section>

    <section id="sec-timetable">
      <h2>Timetable</h2>
      <label class="switch"><input type="checkbox" id="schedule-on"><span>Play modes on a timetable</span></label>
      <div class="timetable" id="timetable"></div>
      <div class="row row--fill" id="entry-add-row">
        <input id="entry-time" type="time" step="60" aria-label="Time">
        <select id="entry-mode" aria-label="Mode"></select>
        <button type="button" id="entry-add">Add</button>
      </div>
      <p class="hint" id="timetable-hint" hidden></p>
    </section>

    <section id="sec-modes">
      <h2>Modes</h2>
      <div class="modes" id="modes"></div>
      <form class="row row--fill" id="mode-save-form">
        <label for="mode-save-name">Save what’s playing as</label>
        <input id="mode-save-name" type="text" maxlength="40" autocomplete="off" spellcheck="false" placeholder="Night">
        <button type="submit">Save</button>
      </form>
    </section>
  </main>

  <script type="module" src="/schedule.js"></script>
</body>
</html>
