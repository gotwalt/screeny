[package]
name = "screeny-provision"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "WiFi provisioning without a radio: the join/portal state machine as a pure function of events and time, the WIFI: QR payload builder, and the portal-screen renderer. Shared by the firmware and the simulator."

# `no_std`, no alloc, no float, no clock, no I/O: this crate is compiled for
# xtensa-esp32-none-elf by the firmware and for the host by the simulator and
# by these tests, so anything it pulls in, they both pull in. The versions are
# the ones `firmware/Cargo.toml` already pins.
[dependencies]
screeny-proto = { path = "../proto" }
heapless = "0.9.3"
embedded-graphics = "0.8.2"
qrcodegen-no-heap = "=1.8.1"

[dev-dependencies]
# An *independent* QR decoder. The renderer's polarity, quiet zone and module
# size are only correct if something that never saw our encoder can read the
# panel back, so `tests/render.rs` decodes the rendered 64x32 frame with this
# and compares the payload byte for byte.
rqrr = { version = "0.11.0", default-features = false }
png = "0.18.1"
