[package]
name = "screeny"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "screeny host sender: frame encoders, per-frame codec chooser, mDNS discovery, paced UDP sender, and the screeny CLI"
default-run = "screeny"
autobenches = false

[dependencies]
screeny-proto = { path = "../proto" }
mdns-sd = "0.21.3"
libc = "0.2"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
anyhow = "1"
ctrlc = "3"

[dev-dependencies]

[[bench]]
name = "encode"
harness = false

[lints.rust]
missing_docs = "warn"
