[package]
name = "screeny"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "screeny host sender: frame encoders, per-frame codec chooser, mDNS discovery, paced UDP sender, and the screeny CLI"
default-run = "screeny"
autobenches = false
# The integration tests are modules of one binary, `tests/host.rs`, so they
# wait on their loopback streams side by side. `pacing.rs` keeps a process to
# itself because it measures the wall clock.
autotests = false

[[test]]
name = "host"
path = "tests/host.rs"

[[test]]
name = "pacing"
path = "tests/pacing.rs"

[dependencies]
screeny-proto = { path = "../proto" }
screeny-panel = { path = "../panel" }
screeny-encode = { path = "../encode" }
screeny-demos = { path = "../demos" }
screeny-provision = { path = "../provision" }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
mdns-sd = "0.21.3"
libc = "0.2"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
anyhow = "1"
ctrlc = "3"

[dev-dependencies]
# The reference receiver (card 006). `window` off: the tests are headless and
# have no business pulling minifb into the dependency tree.
screeny-sim = { path = "../sim", default-features = false }

[[bench]]
name = "encode"
harness = false

[lints.rust]
missing_docs = "warn"
