[package]
name = "screeny-art"
version = "0.1.0"
edition = "2021"
description = "Generative art patches and the output pipeline for the screeny 64x32 LED panel"

[dependencies]
serde = { version = "1", features = ["derive"] }
png = "0.17"
wgpu = { version = "30.0.1", optional = true }
pollster = { version = "1.0.1", optional = true }
bytemuck = { version = "1.25.2", features = ["derive"], optional = true }
libc = "0.2.189"
# The real codec chooser and the real decoder, so `meter.rs` reports what the
# frame actually costs instead of estimating it (card 101). Neither crate opens
# a socket or resolves a name: `screeny-proto` has no dependencies at all and is
# what the firmware runs, and `screeny-encode` is the chooser split out of the
# sender by card 016. The network stack is `screeny`, below, and is optional.
screeny-proto = { path = "../proto" }
screeny-encode = { path = "../encode" }
# The one panel model (card 016, card 102): what the LEDs emit for an sRGB8
# code, including the firmware's temporal dither. `panel.rs` is a thin reading
# of it, not a second copy. No dependencies but `screeny-proto`.
screeny-panel = { path = "../panel" }
screeny = { path = "../screeny", optional = true }
# So `screeny-art play` can send FINAL on ctrl-c and let the panel go at once
# instead of holding the last frame for the stream timeout. `Drop` does not run
# on a signal; see `crates/screeny/README.md`, "Two sharp edges that are left".
ctrlc = { version = "3", optional = true }

[dev-dependencies]
# The reference receiver, for the end-to-end tests. `window` off: they are
# headless and have no business pulling minifb in.
screeny-sim = { path = "../sim", default-features = false }

[features]
default = ["gpu", "sender"]
# GPU patches, through wgpu. Build with --no-default-features for a CPU-only runner.
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]
# `output::SenderOutput` and `screeny-art play`: frames to a real panel over
# UDP, through `screeny`'s `Link`.
#
# On by default (card 112), because the art system is the project's primary
# sender and `tests/sender.rs` - the only place the pixel-exactness claim is
# checked on the wire - is `#![cfg(feature = "sender")]`. Off by default, a
# plain `cargo test` ran none of it and a regression in the link, the chooser or
# the pipeline would have passed silently.
#
# `--no-default-features` (optionally `--features gpu`) is the network-free
# build: no sockets, no mdns-sd, no ctrlc, and `play` gone from the binary.
sender = ["dep:screeny", "dep:ctrlc"]
