[workspace]
resolver = "2"
members = ["crates/*"]
# Everything host-side lives under crates/ (card 017), and every one of them is a
# default member: the studio was the exception while it was a Tauri app needing GUI
# system libraries, and card 105 made it an ordinary server. `cargo build` and
# `cargo test` with no -p now cover the whole workspace.
# firmware/ uses the esp toolchain and an Xtensa target; lab/ is card 002's frozen
# codec reference. Neither belongs in the host workspace.
exclude = ["firmware", "lab", "lab/xtensa-bench", "lab/nostd-check"]

[workspace.package]
edition = "2021"
license = "MIT"

[profile.release]
debug = 1

# Art pieces are per-pixel float maths; unoptimised they cannot hold 30 fps at 16
# samples per pixel, so the studio would be unusable in a debug build.
[profile.dev.package.screeny-art]
opt-level = 2

# The art pipeline now runs the real encoder on every frame and decodes the
# result for the preview (card 101). A debug-built encoder is about ten times
# slower - see `crates/screeny/README.md` - which would cost more than the whole
# frame period on its own, so these two come along.
[profile.dev.package.screeny-encode]
opt-level = 2
[profile.dev.package.screeny-proto]
opt-level = 2
